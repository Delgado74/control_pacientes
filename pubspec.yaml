name: medical_family_care
description: Aplicación Flutter para control de pacientes en Medicina Familiar
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Base de datos SQLite
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  sqflite_common_ffi: ^2.3.0

  # Exportación a Excel
  excel: ^2.0.0

  # File picker para importar Excel
  file_picker: ^8.0.0

  # Exportación a PDF y compartir
  pdf: ^3.11.3
  printing: ^5.11.0
  share_plus: ^10.0.2

  # Gráficos y manejo de listas/tablas
  collection: ^1.18.0
  intl: ^0.19.0

  # UI adicional
  cupertino_icons: ^1.0.8

  # Permisos (almacenamiento, cámara, etc.)
  permission_handler: ^11.3.1

  # Abrir enlaces externos (email, WhatsApp, navegador, etc.)
  url_launcher: ^6.3.0

  file_selector: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icono.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
